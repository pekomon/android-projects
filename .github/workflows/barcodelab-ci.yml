name: Barcode Lab CI

on:
  push:
    paths:
      - 'BarcodeLab/**'
      - '.github/workflows/barcodelab-ci.yml'
  pull_request:
    paths:
      - 'BarcodeLab/**'
      - '.github/workflows/barcodelab-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BarcodeLab
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: barcodelab-debug-apk
          path: BarcodeLab/app/build/outputs/apk/debug/app-debug.apk
