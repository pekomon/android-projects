name: Material3Demo CI

on:
  push:
    paths:
      - 'Material3Demo/**'
      - '.github/workflows/material3demo-ci.yml'
  pull_request:
    paths:
      - 'Material3Demo/**'
      - '.github/workflows/material3demo-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Material3Demo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: material3demo-debug-apk
          path: Material3Demo/app/build/outputs/apk/debug/app-debug.apk
