name: CryptoApp CI

on:
  push:
    paths:
      - 'CryptoApp/**'
      - '.github/workflows/cryptoapp-ci.yml'
  pull_request:
    paths:
      - 'CryptoApp/**'
      - '.github/workflows/cryptoapp-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CryptoApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptoapp-debug-apk
          path: CryptoApp/app/build/outputs/apk/debug/app-debug.apk
